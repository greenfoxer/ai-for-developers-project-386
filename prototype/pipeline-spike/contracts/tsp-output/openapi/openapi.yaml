openapi: 3.0.0
info:
  title: CallCalendar Pipeline Spike
  version: 0.0.0
tags:
  - name: EventTypes
  - name: Bookings
paths:
  /spike/bookings:
    post:
      operationId: Bookings_create
      description: Создание записи (body, 201 + 400/404/409 problem+json)
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
  /spike/event-types:
    get:
      operationId: EventTypes_list
      description: Список типов событий (GET, array ответ)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - EventTypes
  /spike/event-types/availability:
    get:
      operationId: EventTypes_availability
      description: 'Доступность на дату (query-параметры, format: date)'
      parameters:
        - name: eventTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          explode: false
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
      tags:
        - EventTypes
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - date
        - start
        - guest
      properties:
        id:
          type: integer
          format: int32
        eventTypeId:
          type: integer
          format: int32
        date:
          type: string
          format: date
        start:
          type: string
          format: time
        guest:
          $ref: '#/components/schemas/GuestInfo'
      description: 'Запись (T6): id/eventTypeId/start, конец производный от длительности'
    BookingCreate:
      type: object
      required:
        - eventTypeId
        - date
        - start
        - guest
      properties:
        eventTypeId:
          type: integer
          format: int32
        date:
          type: string
          format: date
        start:
          type: string
          format: time
        guest:
          $ref: '#/components/schemas/GuestInfo'
      description: Создание записи (POST body)
    EventType:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - kind
      properties:
        id:
          type: integer
          format: int32
          description: id — целое с автонумерацией (T5); непрозрачный ключ маршрута
        name:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          description: минуты, > 0 (T5)
        kind:
          type: string
          enum:
            - call
            - meeting
          description: enum через pipeline — риск для NSwag/Kiota
      description: 'Псевдо-тип события (мотивы T5: int id, name required, optional description, duration > 0)'
    GuestInfo:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        additionalInfo:
          type: string
      description: 'Гость (T6: name+email required, additionalInfo optional)'
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
          description: http-код, int32
        detail:
          type: string
    Slot:
      type: object
      required:
        - date
        - start
        - available
      properties:
        date:
          type: string
          format: date
        start:
          type: string
          format: time
        available:
          type: boolean
      description: 'Псевдо-слот (мотивы T3/T4/T8): wall-clock date+time отдельными скалярами'
servers:
  - url: http://localhost:5071
    description: Spike dev server
    variables: {}
