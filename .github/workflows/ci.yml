name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CallCalendar.sln

      - name: Lint
        run: dotnet format CallCalendar.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CallCalendar.sln -c Release --no-restore

      - name: Test
        run: dotnet test CallCalendar.sln -c Release --no-build
