# Render Blueprint (Infrastructure as Code): один web-service из Docker-образа приложения.
# Создаётся/поддерживается через Blueprint в дашборде Render: New -> Blueprint -> выбрать репозиторий.
# БД эфемерная (entrypoint сбрасывает sqlite на старте), дисков нет.
# PORT и публичный HTTPS-URL выдаёт сам Render; entrypoint.sh слушает $PORT.
services:
  - type: web
    name: callcalendar
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
